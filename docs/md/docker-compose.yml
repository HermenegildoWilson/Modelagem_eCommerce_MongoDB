version: '3.8'

services:
  # MongoDB Nó 1 (Primary)
  mongo1:
    image: mongo:7.0
    container_name: mongo-node-1
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_123
    volumes:
      - mongo_node1_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - mongodb-network
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
      --keyFile /data/keyfile
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u admin -p mongodb_password_123 --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Nó 2 (Secondary)
  mongo2:
    image: mongo:7.0
    container_name: mongo-node-2
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_123
    volumes:
      - mongo_node2_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - mongodb-network
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
      --keyFile /data/keyfile
    depends_on:
      mongo1:
        condition: service_healthy
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u admin -p mongodb_password_123 --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Nó 3 (Secondary)
  mongo3:
    image: mongo:7.0
    container_name: mongo-node-3
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongodb_password_123
    volumes:
      - mongo_node3_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js
    networks:
      - mongodb-network
    command: >
      mongod
      --replSet rs0
      --bind_ip_all
      --auth
      --keyFile /data/keyfile
    depends_on:
      mongo1:
        condition: service_healthy
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh -u admin -p mongodb_password_123 --authenticationDatabase admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Express (GUI Opcional)
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongodb_password_123
      ME_CONFIG_MONGODB_URL: mongodb://admin:mongodb_password_123@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0&authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    networks:
      - mongodb-network
    depends_on:
      - mongo1
      - mongo2
      - mongo3

volumes:
  mongo_node1_data:
  mongo_node2_data:
  mongo_node3_data:

networks:
  mongodb-network:
    driver: bridge

# INSTRUÇÕES DE USO:
# 
# 1. Iniciar cluster:
#    docker-compose up -d
#
# 2. Verificar status:
#    docker-compose ps
#    docker logs mongo-node-1
#
# 3. Conectar via mongosh:
#    mongosh --host localhost:27017 -u admin -p mongodb_password_123 --authenticationDatabase admin
#
# 4. Dentro do mongosh, inicializar replica set:
#    rs.initiate({
#      _id: "rs0",
#      members: [
#        { _id: 0, host: "mongo1:27017", priority: 1 },
#        { _id: 1, host: "mongo2:27017", priority: 0 },
#        { _id: 2, host: "mongo3:27017", priority: 0 }
#      ]
#    })
#
# 5. Verificar status:
#    rs.status()
#
# 6. Acessar MongoDB Express em: http://localhost:8081
#
# 7. Popular dados:
#    python seed_data.py --host localhost --port 27017 --db ecommerce --count 100000
#
# 8. Executar queries:
#    mongosh --file queries_avancadas.js
#
# 9. Parar cluster:
#    docker-compose down
#
# 10. Parar e remover dados:
#     docker-compose down -v
